<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fantuan Browser Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #111827;
      background: #ffffff;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title { font-weight: 600; font-size: 14px; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
    }
    .badge.connected { background: #dcfce7; color: #166534; }
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    input[type="number"] {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
    }
    button {
      padding: 5px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #f9fafb;
      color: #111827;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #f3f4f6; }
    button.danger {
      border-color: #fecaca;
      background: #fef2f2;
      color: #b91c1c;
    }
    button.danger:hover { background: #fee2e2; }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .sessions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
      max-height: 180px;
      overflow-y: auto;
    }
    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
    }
    .session-meta { font-size: 12px; }
    .session-sub { font-size: 11px; color: #6b7280; }
    .empty { font-size: 12px; color: #9ca3af; padding: 8px 0; }
    .footer { display: flex; justify-content: space-between; gap: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Fantuan Browser</span>
    <span id="statusBadge" class="badge">Disconnected</span>
  </div>

  <div class="row">
    <input id="portInput" type="number" min="1" max="65535" value="19222" />
    <button id="savePortBtn">Save Port</button>
  </div>

  <div class="section-title">Active Agent Tab Groups</div>
  <div id="sessionsList" class="sessions">
    <div class="empty">No active sessions</div>
  </div>

  <div class="footer">
    <button id="reconnectBtn">Reconnect</button>
    <button id="cleanupAllBtn" class="danger">Cleanup All</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
